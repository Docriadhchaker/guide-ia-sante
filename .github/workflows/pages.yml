name: Deploy reader to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: guide_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PGDATABASE: guide_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test database permissions and pending accounts
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/ci-auth-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160001_guide.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160002_pending_reviewers.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610170001_comments.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610170001_comments.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610180001_access_email.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610180001_access_email.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611160001_review_security.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/review-security.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/access-email.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/pending-reviewers.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/comments.sql
          node supabase/tests/edition-update.mjs
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm test
      - run: node scripts/build.mjs --require-config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: [build, database-tests]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
